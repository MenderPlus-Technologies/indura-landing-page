<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Illustration of an older African woman whose right eye is clouded by a cataract">
  <defs>
    <radialGradient id="bgg" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#FFE7C7"/><stop offset="1" stop-color="#FFD3A1"/></radialGradient>
    <radialGradient id="cloud" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#F4F8FA"/><stop offset=".7" stop-color="#D3DEE3"/><stop offset="1" stop-color="#B9C7CD"/></radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A5636"/><stop offset="1" stop-color="#6E4129"/></linearGradient>
    <clipPath id="c"><circle cx="200" cy="220" r="200"/></clipPath>
  </defs>
  <circle cx="200" cy="220" r="200" fill="url(#bgg)"/>
  <g clip-path="url(#c)">
    <!-- shoulders / dress -->
    <path d="M40 440 C60 350 120 320 200 318 C280 320 340 350 360 440 Z" fill="#0E8A70"/>
    <path d="M150 330 L200 380 L250 330" fill="none" stroke="#F2A93B" stroke-width="10" stroke-linejoin="round"/>
    <!-- neck -->
    <path d="M168 270 L168 330 Q200 348 232 330 L232 270 Z" fill="#6E4129"/>
    <!-- ears -->
    <ellipse cx="112" cy="205" rx="14" ry="24" fill="#7A4A2E"/>
    <ellipse cx="288" cy="205" rx="14" ry="24" fill="#7A4A2E"/>
    <circle cx="112" cy="234" r="6" fill="#F2C14E"/><circle cx="288" cy="234" r="6" fill="#F2C14E"/>
    <!-- face -->
    <path d="M200 92 C262 92 290 140 288 196 C286 254 250 300 200 302 C150 300 114 254 112 196 C110 140 138 92 200 92 Z" fill="url(#skin)"/>
    <!-- grey hair at temples -->
    <path d="M118 168 C120 140 132 124 146 116" fill="none" stroke="#D9D9D9" stroke-width="9" stroke-linecap="round"/>
    <path d="M282 168 C280 140 268 124 254 116" fill="none" stroke="#D9D9D9" stroke-width="9" stroke-linecap="round"/>
    <!-- headwrap (gele) -->
    <path d="M104 150 C100 80 150 40 205 42 C262 44 304 84 296 150 C270 118 236 108 200 108 C164 108 130 118 104 150 Z" fill="#E86A3A"/>
    <path d="M150 58 C190 20 250 24 300 70 C268 64 236 70 210 84 Z" fill="#F2A93B"/>
    <path d="M118 120 C160 98 240 98 284 120" fill="none" stroke="#C4502A" stroke-width="5" stroke-linecap="round"/>
    <!-- eyebrows -->
    <path d="M140 168 Q160 158 182 166" fill="none" stroke="#3A2416" stroke-width="5" stroke-linecap="round"/>
    <path d="M218 166 Q240 158 260 168" fill="none" stroke="#3A2416" stroke-width="5" stroke-linecap="round"/>
    <!-- left eye (clear) -->
    <ellipse cx="161" cy="192" rx="20" ry="12" fill="#FBF6EE"/>
    <circle cx="161" cy="192" r="9" fill="#3B2314"/><circle cx="161" cy="192" r="4" fill="#120A05"/><circle cx="158" cy="189" r="2.4" fill="#FFFFFF"/>
    <!-- right eye (cataract: milky lens) -->
    <ellipse cx="239" cy="192" rx="20" ry="12" fill="#FBF6EE"/>
    <circle cx="239" cy="192" r="9.5" fill="url(#cloud)"/>
    <circle cx="239" cy="192" r="9.5" fill="none" stroke="#9FB1B8" stroke-width="1"/>
    <!-- lids / age lines -->
    <path d="M140 186 Q161 176 182 186" fill="none" stroke="#4A2C1B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M218 186 Q239 176 260 186" fill="none" stroke="#4A2C1B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M146 208 Q161 214 176 208" fill="none" stroke="#5C3620" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    <path d="M224 208 Q239 214 254 208" fill="none" stroke="#5C3620" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    <!-- nose -->
    <path d="M200 200 C198 222 190 236 186 244 C194 250 206 250 214 244" fill="none" stroke="#4A2C1B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- smile lines + mouth -->
    <path d="M168 252 Q160 266 166 278" fill="none" stroke="#5C3620" stroke-width="2.2" stroke-linecap="round" opacity=".6"/>
    <path d="M232 252 Q240 266 234 278" fill="none" stroke="#5C3620" stroke-width="2.2" stroke-linecap="round" opacity=".6"/>
    <path d="M180 270 Q200 282 220 270" fill="none" stroke="#3A1F12" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- callout -->
  <g>
    <circle cx="239" cy="192" r="26" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="5 5"/>
    <path d="M262 178 L330 130" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="300" y="100" width="92" height="34" rx="17" fill="#FFFFFF"/>
    <text x="346" y="122" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D1F1B">Cloudy lens</text>
  </g>
</svg>
